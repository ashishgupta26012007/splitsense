<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - SplitSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrap">

      <div class="hero-mark">
        <span class="hero-mark-dot"></span>
        <span class="hero-mark-line"></span>
        <span class="hero-mark-dot hero-mark-dot--end"></span>
      </div>
      <h1 class="wordmark auth-wordmark">SplitSense</h1>
      <p class="tagline auth-tagline">Create an account to get started.</p>

      <div class="card auth-card">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="auth-flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="auth-form">
          <label class="card-label" for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>

          <label class="card-label" style="margin-top:16px;" for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Choose a password" required>

          <button type="submit" class="btn-primary auth-submit">Sign Up</button>
        </form>

        <div class="auth-switch">
          Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </div>
      </div>

      <footer class="footer">
        <span>SplitSense</span>
      </footer>
    </div>
  </div>
</body>
</html>
